apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: gitops-demo
          image: nginx:1.26
          ports:
            - containerPort: 80
