apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vishnumohandas1994/argocd-gitops-practice.git
    targetRevision: main
    path: prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
