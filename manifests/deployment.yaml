apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: gitops-demo-config
              key: APP_ENV

        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: gitops-demo-config
              key: APP_MESSAGE
