apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-helm-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vishnumohandas1994/argocd-gitops-practice.git
    targetRevision: main
    path: gitops-demo-chart

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: helm-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
